<style>
/* ─── tokens ─────────────────────────────────────────────────
   백코모드가 바닥값이라 스크립트가 돌기 전에도 기본 테마로 그려진다.
   나머지 셋은 data-theme으로 덮어쓴다. */
:root{
  --paper:#FFEAF3; --field:#FFF6FB; --surface:#FFFFFF;
  --ink:#4E2242; --ink-2:#7A4A6B; --ink-3:#9E6A8C;
  --rule:#F6C9E0; --rule-soft:#FBE0EE;
  --navy:#FF2D87; --navy-ink:#FFFFFF; --danger:#D6246B;
  --tone:0%;            /* scale-ramp lightness shift */
  --chip:-30%;          /* cm-chip text shift */
  --ink-shift:-46%;     /* how deep the initial sits under its disc */
  --paper-2:#F0E4FC;
  --body-bg:radial-gradient(126% 92% at 50% 0%,#FFF5FB 0%,#FFE7F4 44%,#F0E4FC 100%);
  --shadow:0 1px 2px rgba(122,40,92,.07), 0 10px 26px -12px rgba(206,64,142,.36);
  --shadow-lift:0 2px 8px rgba(122,40,92,.12), 0 20px 44px -16px rgba(206,64,142,.46);
  --r:10px;
}

/* 블루밍 — 하늘색에서 파스텔 민트를 지나 바다로 */
:root[data-theme="blooming"]{
  --paper:#E4F2FA; --field:#F4FBFE; --surface:#FFFFFF;
  --ink:#123742; --ink-2:#376274; --ink-3:#55848F;
  --rule:#BEDFEC; --rule-soft:#DBEFF7;
  --navy:#0E90B4; --navy-ink:#FFFFFF; --danger:#C0374C;
  --tone:0%; --chip:-30%; --ink-shift:-46%;
  --paper-2:#D9F5EE;
  --body-bg:radial-gradient(126% 92% at 50% 0%,#F3FCFE 0%,#DCEFFA 44%,#D9F5EE 100%);
  --shadow:0 1px 2px rgba(18,55,66,.07), 0 10px 26px -12px rgba(30,120,150,.34);
  --shadow-lift:0 2px 8px rgba(18,55,66,.12), 0 20px 44px -16px rgba(30,120,150,.44);
}

/* 블루레몬 — 볕 든 레몬빛에서 깊은 바다로 */
:root[data-theme="bluelemon"]{
  --paper:#FDF1D2; --paper-2:#B7DEEC; --field:#FCFBF4; --surface:#FFFFFF;
  --ink:#263A44; --ink-2:#476574; --ink-3:#617F8C;
  --rule:#CFDFE4; --rule-soft:#E6EFF1;
  --navy:#1B7CA6; --navy-ink:#FFFFFF; --danger:#BF4437;
  --tone:0%; --chip:-26%; --ink-shift:-42%;
  --body-bg:linear-gradient(172deg,#FEF6E0 0%,#FCEBBE 26%,#DCEEE4 62%,#AFDAEB 100%);
  --shadow:0 1px 2px rgba(30,58,68,.07), 0 10px 26px -12px rgba(28,110,144,.34);
  --shadow-lift:0 2px 8px rgba(30,58,68,.12), 0 20px 44px -16px rgba(28,110,144,.44);
}

:root[data-theme="light"]{
  --paper:#EDEFF3; --field:#F6F7FA; --surface:#FFFFFF;
  --ink:#14181F; --ink-2:#4B5563; --ink-3:#7C8798;
  --rule:#CBD2DC; --rule-soft:#DDE2EA;
  --navy:#1F3A5F; --navy-ink:#FFFFFF; --danger:#B3261E;
  --tone:0%; --chip:-9%; --ink-shift:-28%;
  --paper-2:#EDEFF3;   /* flat: same as --paper, so the PNG ground stays solid */
  --body-bg:var(--paper);
  --shadow:0 1px 2px rgba(20,24,31,.06), 0 8px 24px -12px rgba(20,24,31,.22);
  --shadow-lift:0 2px 6px rgba(20,24,31,.10), 0 18px 40px -16px rgba(20,24,31,.34);
}

:root[data-theme="dark"]{
  --paper:#0E1116; --field:#131820; --surface:#1A2029;
  --ink:#E5E9EF; --ink-2:#A6B0BF; --ink-3:#6F7B8C;
  --rule:#2C3543; --rule-soft:#232B36;
  --navy:#8FB4E4; --navy-ink:#0E1116; --danger:#F2867E;
  --tone:9%; --chip:10%; --ink-shift:-38%;
  --paper-2:#0E1116;
  --body-bg:var(--paper);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.45), 0 18px 40px -16px rgba(0,0,0,.8);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--body-bg); background-attachment:fixed; color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}

/* ─── shell ──────────────────────────────────────────────── */
.wrap{max-width:1360px;margin:0 auto;padding:28px 20px 64px;display:flex;flex-direction:column;gap:18px}

header.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow.handle{text-transform:none;letter-spacing:.06em;font-size:12px}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
h1{
  font-family:"Bricolage Grotesque","IBM Plex Sans KR",sans-serif;
  font-variation-settings:"wdth" 88,"opsz" 48;
  font-weight:700;font-size:clamp(30px,4.4vw,46px);line-height:1.02;
  margin:0;letter-spacing:-.02em;text-wrap:balance;
}
.tagline{color:var(--ink-2);font-size:14px;max-width:46ch}

.stats{display:flex;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:9px 16px;display:flex;flex-direction:column;gap:1px;min-width:78px}
.stat + .stat{border-left:1px solid var(--rule-soft)}
.stat .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:11px;font-weight:400;color:var(--ink-3);margin-left:1px}

/* ─── toolbar ────────────────────────────────────────────── */
.bars{display:flex;flex-direction:column;gap:8px}
.toolbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:10px 12px;background:var(--surface);
  border:1px solid var(--rule);border-radius:var(--r);
}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:8px;border:1px solid var(--rule);
  background-color:var(--surface);cursor:pointer;font-size:13.5px;font-weight:500;
  transition:background-color .14s,border-color .14s,transform .14s,opacity .14s;
}
.btn:hover{background-color:var(--field);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background-color:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;background-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background-color:var(--field);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--rule)}
.btn.danger:hover{background-color:color-mix(in srgb,var(--danger) 10%,transparent);border-color:var(--danger)}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{
  padding:8px 13px;background-color:var(--surface);border:0;cursor:pointer;
  font-size:13px;color:var(--ink-2);transition:background-color .14s,color .14s;
}
.seg button + button{border-left:1px solid var(--rule-soft)}
.seg button[aria-pressed="true"]{background-color:var(--navy);color:var(--navy-ink);font-weight:600}
.seg button:not([aria-pressed="true"]):hover{background-color:var(--field);color:var(--ink)}

.knob{display:flex;align-items:center;gap:9px;padding-left:2px}
.knob > label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.knob input[type=range]{width:104px;accent-color:var(--navy)}
.knob .val{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:52px}
.knob.off{opacity:.35}
.spacer{flex:1 1 auto;min-width:0}
.sep{width:1px;align-self:stretch;background:var(--rule-soft);margin:0 2px}

/* ─── the field ──────────────────────────────────────────── */
.fieldwrap{
  position:relative;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--field);overflow-x:auto;overflow-y:hidden;box-shadow:var(--shadow);
}
.fieldwrap.vert{overflow-y:visible}
.plot{position:relative;min-height:320px}
.grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(to right,var(--rule-soft) 0 1px,transparent 1px var(--gx,60px)),
    repeating-linear-gradient(to bottom,var(--rule-soft) 0 1px,transparent 1px var(--gy,60px));
  background-position:var(--gx-off,0) var(--gy-off,0);
  opacity:.7;
  -webkit-mask-image:var(--gmask,linear-gradient(to bottom,transparent 0,#000 40px));
          mask-image:var(--gmask,linear-gradient(to bottom,transparent 0,#000 40px));
}

.leader{position:absolute;pointer-events:none}
.leader.h{width:0;border-left:1px dashed hsl(var(--ch) var(--cs) calc(var(--cl) + var(--tone)) / .5)}
.leader.v{height:0;border-top:1px dashed hsl(var(--ch) var(--cs) calc(var(--cl) + var(--tone)) / .5)}
.leader::after{
  content:"";position:absolute;width:6px;height:6px;border-radius:50%;
  background:hsl(var(--ch) var(--cs) calc(var(--cl) + var(--tone)));
}
.leader.h::after{left:-3px;bottom:-3px}
.leader.v::after{top:-3px;left:-3px}

/* ─── character token ────────────────────────────────────── */
.tok{
  position:absolute;display:flex;border:0;background:none;padding:0;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.7,.3,1);
}
.tok.h{flex-direction:column;align-items:center;gap:6px}
.tok.v{flex-direction:row;align-items:center;gap:11px;text-align:left}
.tok:hover,.tok:focus-visible{z-index:5}
.tok.h:hover,.tok.h:focus-visible{transform:translateY(-5px)}
.tok.v:hover,.tok.v:focus-visible{transform:translateX(5px)}
.disc{
  width:var(--d);height:var(--d);border-radius:50%;overflow:hidden;position:relative;flex:0 0 auto;
  background-color:hsl(var(--ch) var(--cs) calc(var(--cl) + var(--tone)));
  box-shadow:var(--shadow), 0 0 0 3px var(--field), 0 0 0 4px hsl(var(--ch) var(--cs) calc(var(--cl) + var(--tone)) / .55);
  transition:box-shadow .18s;
}
.tok:hover .disc,.tok:focus-visible .disc{
  box-shadow:var(--shadow-lift), 0 0 0 3px var(--field), 0 0 0 5px hsl(var(--ch) var(--cs) calc(var(--cl) + var(--tone)));
}
/* pastel bloom */
:root[data-theme="baekco"] .disc,
:root[data-theme="blooming"] .disc,
:root[data-theme="bluelemon"] .disc{
  box-shadow:var(--shadow), 0 0 0 3px var(--field),

<script>
(() => {
"use strict";

/* ─── constants ──────────────────────────────────────────── */
const HGAP = 18, VGAP = 20;   // clearance between tokens
const PAD  = 78;              // horizontal padding, horizontal mode
const LABEL = 68;             // label band under a disc, horizontal mode
const RH   = 40;              // ruler band, horizontal mode
const GUT  = 66;              // ruler gutter, vertical mode
const VTEXT = 148;            // label column beside a disc, vertical mode
const VGAP2 = 14, VCOL = 20;  // vertical-mode gaps

const RAMPS = {
  /* saturation dips through the middle so the teal→amber sweep
     reads as muted sage, never fluorescent green */
  base: [
    { p:0,   h:184, s:44, l:37 },
    { p:0.5, h:104, s:17, l:48 },
    { p:1,   h:26,  s:66, l:47 },
  ],
  /* 백코모드: 라일락 → 솜사탕 핑크 → 피치. 초록을 아예 지나지 않는다 */
  baekco: [
    { p:0,   h:264, s:58, l:74 },
    { p:0.5, h:330, s:74, l:74 },
    { p:1,   h:24,  s:84, l:71 },
  ],
  /* 블루레몬: 볕든 레몬 → 물빛 → 깊은 바다. 중간 채도를 낮춰
     노랑에서 파랑으로 넘어갈 때 형광 연두를 지나지 않게 한다 */
  bluelemon: [
    { p:0,    h:45,  s:88, l:66 },
    { p:0.20, h:74,  s:38, l:62 },
    { p:0.55, h:170, s:42, l:57 },
    { p:1,    h:206, s:66, l:50 },
  ],
  /* 블루밍: 하늘색 → 파스텔 민트 → 바다. 큰 키일수록 물이 깊어진다 */
  blooming: [
    { p:0,   h:202, s:76, l:78 },
    { p:0.5, h:166, s:56, l:71 },
    { p:1,   h:194, s:62, l:55 },
  ],
};
const activeRamp = () => RAMPS[document.documentElement.getAttribute("data-theme")] || RAMPS.base;

const SEED = [
  { name:"쿠기사키 노바라", series:"주술회전", height:160 },
  { name:"미도리야 이즈쿠", series:"나의 히어로 아카데미아", height:166 },
  { name:"바쿠고 카츠키",   series:"나의 히어로 아카데미아", height:172 },
  { name:"이타도리 유지",   series:"주술회전", height:173 },
  { name:"후시구로 메구미", series:"주술회전", height:175 },
  { name:"토도로키 쇼토",   series:"나의 히어로 아카데미아", height:176 },
  { name:"아이자와 쇼타",   series:"나의 히어로 아카데미아", height:183 },
  { name:"나나미 켄토",     series:"주술회전", height:184 },
  { name:"고죠 사토루",     series:"주술회전", height:190 },
];

/* A file exported by "HTML로 저장" carries its own data and its own
   storage key, so it never collides with the page it came from. */
const BAKED = (typeof window.__HC_SEED__ === "object" && window.__HC_SEED__) || null;
const KEY = BAKED ? "height-chart/x-" + BAKED.eid : "height-chart/v1";

const state = {
  chars: [], mode:"prop", orient:"h", theme:"baekco", ppc:60, ppcH:60, ppcV:26, size:84,
  editing:null, draft:{ img:null, iz:1, ix:0, iy:0 },
};

const $ = (s, r=document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const fmt = n => (Number.isInteger(n) ? String(n) : n.toFixed(1));

/* ─── persistence ────────────────────────────────────────── */
function adopt(d){
  if (!d || !Array.isArray(d.chars)) return false;
  const chars = d.chars.map(normalize).filter(Boolean);
  if (!chars.length) return false;
  state.chars = chars;
  if (d.mode === "rank" || d.mode === "prop") state.mode = d.mode;
  if (d.orient === "v" || d.orient === "h") state.orient = d.orient;
  const th = d.theme === "pado" ? "bluelemon" : d.theme;   /* 첫 이름이 파도였다 */
  if (["light","dark","baekco","blooming","bluelemon"].indexOf(th) >= 0) state.theme = th;
  if (Number.isFinite(d.ppcH)) state.ppcH = clamp(d.ppcH, 18, 130);
  if (Number.isFinite(d.ppcV)) state.ppcV = clamp(d.ppcV, 18, 130);
  if (Number.isFinite(d.ppc)) state.ppc = clamp(d.ppc, 18, 130);
  else state.ppc = state.orient === "v" ? state.ppcV : state.ppcH;
  if (Number.isFinite(d.size)) state.size = clamp(d.size, 52, 150);
  return true;
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if (raw){ try { if (adopt(JSON.parse(raw))) return; } catch(e){} }
  if (BAKED && adopt(BAKED)) return;
  state.chars = SEED.map(normalize);
}
function snapshot(){
  const h = state.orient === "h" ? state.ppc : state.ppcH;
  const v = state.orient === "v" ? state.ppc : state.ppcV;
  return { chars:state.chars, mode:state.mode, orient:state.orient, theme:state.theme,
           ppc:state.ppc, ppcH:h, ppcV:v, size:state.size };
}
function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(snapshot()));
    $("#savedAt").textContent = "저장됨 " + new Date().toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" });
  } catch(e){
    $("#savedAt").textContent = "저장 공간이 가득 찼습니다 — 이미지를 줄이거나 캐릭터를 지워 주세요";
  }
}
function normalize(c){
  const h = Number(c && c.height);
  if (!c || !Number.isFinite(h)) return null;
  return {
    id: c.id || uid(),
    name: String(c.name || "이름 없음").slice(0, 40),
    series: String(c.series || "").slice(0, 40),
    height: clamp(Math.round(h * 2) / 2, 80, 280),
    img: typeof c.img === "string" && c.img.startsWith("data:image") ? c.img : null,
    /* fv 2 = framing measured against object-fit:contain. Anything older
       was measured against cover, where the same number frames something
       else entirely — reset it to the whole picture instead of guessing. */
    fv: 2,
    iz: c.fv === 2 ? clamp(Number(c.iz) || 1, 0.25, 6) : 1,
    ix: c.fv === 2 ? clamp(Number(c.ix) || 0, -1000, 1000) : 0,
    iy: c.fv === 2 ? clamp(Number(c.iy) || 0, -1000, 1000) : 0,
  };
}

/* ─── colour ─────────────────────────────────────────────── */
function ramp(t){
  t = clamp(t, 0, 1);
  const R = activeRamp();
  let i = 0;
  while (i < R.length - 2 && t > R[i + 1].p) i++;
  const a = R[i], b = R[i + 1], u = (t - a.p) / (b.p - a.p);
  /* take the short arc: 330°→24° must cross red, not loop back
     through blue and green */
  let dh = b.h - a.h;
  if (dh > 180) dh -= 360; else if (dh < -180) dh += 360;
  return {
    h: Math.round(((a.h + dh * u) % 360 + 360) % 360),
    s: Math.round(a.s + (b.s - a.s) * u),
    l: Math.round(a.l + (b.l - a.l) * u),
  };
}
function paint(el, t){
  const c = ramp(t);
  el.style.setProperty("--ch", c.h);
  el.style.setProperty("--cs", c.s + "%");
  el.style.setProperty("--cl", c.l + "%");
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toneNow = () => parseFloat(cssVar("--tone")) || 0;
/* the same colour the DOM shows, resolved for canvas */
function rampCss(t, alpha){
  const c = ramp(t), l = c.l + toneNow();
  return `hsl(${c.h} ${c.s}% ${l}%${alpha == null ? "" : " / " + alpha})`;
}
function inkOn(t){
  const c = ramp(t), shift = parseFloat(cssVar("--ink-shift")) || -28;
  return `hsl(${c.h} ${c.s + 14}% ${c.l + toneNow() + shift}%)`;
}

/* ─── layout ─────────────────────────────────────────────── */
function bounds(list){
  const hs = list.map(c => c.height);
  let lo = Math.min(...hs), hi = Math.max(...hs);
  if (hi - lo < 8){ const m = (hi + lo) / 2; lo = m - 4; hi = m + 4; }
  const pad = Math.max(2, (hi - lo) * 0.1);
  return { lo: Math.floor((lo - pad) / 2) * 2, hi: Math.ceil((hi + pad) / 2) * 2 };
}
/* greedy: first lane whose last occupant clears this one */
function packLanes(pos, step){
  const last = [];
  const lane = pos.map(p => {
    for (let i = 0; i < last.length; i++) if (p - last[i] >= step){ last[i] = p; return i; }
    last.push(p); return last.length - 1;
  });
  return { lane, count: Math.max(1, last.length) };
}

function computeLayout(){
  const list = [...state.chars].sort((a, b) => a.height - b.height || a.name.localeCompare(b.name, "ko"));
  if (!list.length) return null;

  const { lo, hi } = bounds(list);
  const span = hi - lo;
  const cLo = list[0].height, cHi = list[list.length - 1].height;
  const tOf = h => (cHi > cLo ? (h - cLo) / (cHi - cLo) : 0.5);
  const D = state.size, ppc = state.ppc, vert = state.orient === "v";
  const view = $("#fieldwrap");
  const viewW = view.clientWidth || 1200;
  const viewH = Math.max(360, (window.innerHeight || 800) - 260);

  if (!vert){
    const step = D + HGAP;
    const tokW = D + 34;
    let xs;
    if (state.mode === "rank"){
      const inner = Math.max(viewW - PAD * 2, (list.length - 1) * step);
      xs = list.map((_, i) => PAD + (list.length === 1 ? inner / 2 : (inner * i) / (list.length - 1)));
    } else {
      xs = list.map(c => PAD + (c.height - lo) * ppc);
    }
    const { lane, count } = packLanes(xs, step);
    const LANE = D + LABEL + VGAP;
    const H = RH + count * LANE + 22;
    const axisW = state.mode === "prop" ? PAD * 2 + span * ppc : 0;
    const W = Math.max(viewW, axisW, Math.ceil(xs[xs.length - 1] + PAD));
    const axisPx = state.mode === "prop" ? ppc : (W - PAD * 2) / span;
    const items = list.map((c, i) => ({
      c, t: tOf(c.height), lane: lane[i],
      cx: xs[i],
      cy: H - RH - 10 - lane[i] * LANE - LABEL - D / 2,
      tickAt: state.mode === "prop" ? xs[i] : PAD + (c.height - lo) * axisPx,
    }));
    return { vert:false, list, items, lo, hi, span, D, W, H, LANE, tokW, axisPx,
             baseline: H - RH, blockBot: L => H - RH - 10 - L * LANE };
  }

  const tokW = D + 11 + VTEXT;
  const step = D + VGAP2;
  const top0 = D / 2 + 20;
  let ys;
  if (state.mode === "rank"){
    const inner = Math.max(viewH - top0 * 2, (list.length - 1) * step);
    ys = list.map((_, i) => top0 + (list.length === 1 ? inner / 2 : (inner * (list.length - 1 - i)) / (list.length - 1)));
  } else {
    ys = list.map(c => top0 + (hi - c.height) * ppc);
  }
  /* pack from the top downwards, so sort keys must ascend */
  const order = list.map((_, i) => i).sort((a, b) => ys[a] - ys[b]);
  const packed = packLanes(order.map(i => ys[i]), step);
  const lane = [];
  order.forEach((idx, k) => { lane[idx] = packed.lane[k]; });
  const count = packed.count;

  const H = Math.max(viewH, Math.ceil(ys[0] + top0));
  const axisPx = state.mode === "prop" ? ppc : (H - top0 * 2) / span;
  const W = Math.max(view.clientWidth || 0, GUT + 34 + count * (tokW + VCOL) + 12);
  const items = list.map((c, i) => ({
    c, t: tOf(c.height), lane: lane[i],
    cx: GUT + 34 + lane[i] * (tokW + VCOL) + D / 2,
    cy: ys[i],
    tickAt: state.mode === "prop" ? ys[i] : top0 + (hi - c.height) * axisPx,
  }));
  return { vert:true, list, items, lo, hi, span, D, W, H, tokW, top0, axisPx,
           baseline: GUT, laneX: L => GUT + 34 + L * (tokW + VCOL) };
}

/* ─── DOM render ─────────────────────────────────────────── */
function render(){
  const plot = $("#plot"), ruler = $("#ruler"), grid = $("#grid"), wrap = $("#fieldwrap");
  plot.querySelectorAll(".tok,.leader,.empty").forEach(n => n.remove());
  ruler.innerHTML = "";

  const L = computeLayout();
  renderStats(L);
  wrap.classList.toggle("vert", state.orient === "v");

  if (!L){
    plot.style.width = "100%"; plot.style.height = "320px";
    grid.style.setProperty("--gx", "60px"); grid.style.setProperty("--gy", "60px");
    grid.style.setProperty("--gx-off", "0px"); grid.style.setProperty("--gy-off", "0px");
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "아직 캐릭터가 없습니다. ‘＋ 캐릭터 추가’로 첫 인물을 올려 보세요.";
    plot.appendChild(e);
    return;
  }

  plot.style.width = L.W + "px";
  plot.style.height = L.H + "px";

  /* graph-paper ruling, aligned to the ruler's own cm ticks */
  const gs = state.mode === "prop" ? (state.ppc >= 24 ? state.ppc : state.ppc * 5) : 60;
  if (L.vert){
    grid.style.setProperty("--gx", "60px");
    grid.style.setProperty("--gy", gs + "px");
    grid.style.setProperty("--gx-off", "0px");
    grid.style.setProperty("--gy-off", (state.mode === "prop" ? L.top0 % gs : 0) + "px");
    grid.style.setProperty("--gmask", "linear-gradient(to right,transparent 0,#000 " + GUT + "px)");
  } else {
    grid.style.setProperty("--gx", gs + "px");
    grid.style.setProperty("--gy", "60px");
    grid.style.setProperty("--gx-off", (state.mode === "prop" ? PAD : 0) + "px");
    grid.style.setProperty("--gy-off", "0px");
    grid.style.setProperty("--gmask", "linear-gradient(to bottom,transparent 0,#000 40px)");
  }

  renderRuler(ruler, L);

  for (const it of L.items){
    const leader = document.createElement("div");
    leader.className = "leader " + (L.vert ? "v" : "h");
    paint(leader, it.t);
    if (L.vert){
      leader.style.left = L.baseline + "px";
      leader.style.top = it.cy + "px";
      leader.style.width = Math.max(0, it.cx - L.D / 2 - 4 - L.baseline) + "px";
    } else {
      leader.style.left = it.cx + "px";
      leader.style.top = L.blockBot(it.lane) + "px";
      leader.style.height = Math.max(0, L.baseline - L.blockBot(it.lane)) + "px";
    }
    plot.appendChild(leader);

    plot.appendChild(buildToken(it, L));
  }
}

function buildToken(it, L){
  const c = it.c, D = L.D;
  const tok = document.createElement("button");
  tok.type = "button";
  tok.className = "tok " + (L.vert ? "v" : "h");
  tok.style.setProperty("--d", D + "px");
  paint(tok, it.t);
  if (L.vert){
    tok.style.left = (it.cx - D / 2) + "px";
    tok.style.top = (it.cy - D / 2) + "px";
    tok.style.width = L.tokW + "px";
  } else {
    tok.style.left = (it.cx - L.tokW / 2) + "px";
    tok.style.top = (it.cy - D / 2) + "px";
    tok.style.width = L.tokW + "px";
  }
  tok.setAttribute("aria-label", `${c.name} ${fmt(c.height)}cm — 수정`);

  const disc = document.createElement("div");
  disc.className = "disc";
  if (c.img){
    const im = document.createElement("img");
    im.src = c.img; im.alt = ""; im.draggable = false;
    im.style.setProperty("--iz", c.iz);
    im.style.setProperty("--ix", c.ix);
    im.style.setProperty("--iy", c.iy);
    disc.appendChild(im);
  } else {
    const sp = document.createElement("span");
    sp.className = "initial";
    sp.textContent = [...c.name][0] || "?";
    disc.appendChild(sp);
  }
  tok.appendChild(disc);

  const meta = document.createElement("div");
  meta.className = "meta";
  const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = c.name;
  meta.appendChild(nm);
  if (c.series){ const sr = document.createElement("span"); sr.className = "sr"; sr.textContent = c.series; meta.appendChild(sr); }
  const cm = document.createElement("span"); cm.className = "cm"; cm.textContent = fmt(c.height) + "cm";
  meta.appendChild(cm);
  tok.appendChild(meta);

  tok.addEventListener("click", () => openPanel(c.id));
  return tok;
}

function tickPlan(){
  const p = state.ppc;
  return { step: p >= 46 ? 1 : p >= 26 ? 2 : 5, lab: p >= 46 ? 5 : 10 };
}

function renderRuler(ruler, L){
  const base = document.createElement("div");
  base.className = "base";
  if (L.vert){
    ruler.style.cssText = `left:0;top:0;width:${GUT}px;height:${L.H}px`;
    base.style.cssText = `left:${GUT - 1}px;top:0;width:1.5px;height:100%`;
  } else {
    ruler.style.cssText = `left:0;bottom:0;width:${L.W}px;height:${RH}px`;
    base.style.cssText = `left:0;top:0;width:100%;height:1.5px`;
  }
  ruler.appendChild(base);

  if (state.mode === "prop"){
    const { step, lab } = tickPlan();
    for (let h = L.lo; h <= L.hi; h += step){
      const major = h % lab === 0;
      const t = document.createElement("div");
      t.className = "tick";
      if (L.vert){
        const y = L.top0 + (L.hi - h) * state.ppc;
        const w = major ? 12 : 6;
        t.style.cssText = `left:${GUT - 1 - w}px;top:${y}px;width:${w}px;height:1px;` +
          (major ? "background:var(--ink-3)" : "");
        ruler.appendChild(t);
        if (major){
          const l = document.createElement("div");
          l.className = "rlab";
          l.textContent = h;
          l.style.cssText = `right:${GUT - 1 + 4}px;top:${y - 8}px;text-align:right`;
          l.style.right = "auto"; l.style.left = "6px";
          ruler.appendChild(l);
        }
      } else {
        const x = PAD + (h - L.lo) * state.ppc;
        t.style.cssText = `left:${x}px;top:0;width:1px;height:${major ? 12 : 6}px;transform:translateX(-.5px);` +
          (major ? "background:var(--ink-3)" : "");
        ruler.appendChild(t);
        if (major){
          const l = document.createElement("div");
          l.className = "rlab";
          l.textContent = h;
          l.style.cssText = `left:${x}px;top:16px;transform:translateX(-50%)`;
          ruler.appendChild(l);
        }
      }
    }
  }

  const unit = document.createElement("div");
  unit.className = "runit";
  unit.textContent = "cm";
  unit.style.cssText = L.vert ? "left:6px;top:4px" : "left:12px;bottom:6px";
  ruler.appendChild(unit);

  for (const it of L.items){
    const hit = document.createElement("div");
    hit.className = "tick";
    paint(hit, it.t);
    const col = "hsl(var(--ch) var(--cs) calc(var(--cl) + var(--tone)))";
    if (L.vert) hit.style.cssText = `left:${GUT - 1 - 16}px;top:${it.tickAt}px;width:16px;height:2px;background:${col}`;
    else        hit.style.cssText = `left:${it.tickAt}px;top:0;width:2px;height:16px;transform:translateX(-1px);background:${col}`;
    ruler.appendChild(hit);
  }
}

function renderStats(L){
  const box = $("#stats");
  box.innerHTML = "";
  if (!L){ box.innerHTML = '<div class="stat"><span class="k">인원</span><span class="v">0</span></div>'; return; }
  const hs = L.list.map(c => c.height);
  const avg = hs.reduce((a, b) => a + b, 0) / hs.length;
  const rows = [
    ["인원", String(hs.length), "명"],
    ["최단", fmt(hs[0]), "cm"],
    ["최장", fmt(hs[hs.length - 1]), "cm"],
    ["평균", avg.toFixed(1), "cm"],
    ["편차", fmt(hs[hs.length - 1] - hs[0]), "cm"],
  ];
  for (const [k, v, u] of rows){
    const d = document.createElement("div");
    d.className = "stat";
    const ke = document.createElement("span"); ke.className = "k"; ke.textContent = k;
    const ve = document.createElement("span"); ve.className = "v"; ve.textContent = v;
    const s = document.createElement("small"); s.textContent = u; ve.appendChild(s);
    d.append(ke, ve);
    box.appendChild(d);
  }
}

/* ─── editor: image framing ──────────────────────────────── */
function openPanel(id){
  state.editing = id || null;
  const c = id ? state.chars.find(x => x.id === id) : null;
  state.draft = c ? { img:c.img, iz:c.iz, ix:c.ix, iy:c.iy } : { img:null, iz:1, ix:0, iy:0 };
  $("#panelTitle").textContent = c ? "캐릭터 수정" : "캐릭터 추가";
  $("#fName").value = c ? c.name : "";
  $("#fSeries").value = c ? c.series : "";
  $("#fHeight").value = c ? c.height : "";
  $("#delBtn").style.display = c ? "" : "none";
  syncStage();
  $("#panel").classList.add("on");
  $("#panel").setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("on");
  setTimeout(() => $("#fName").focus(), 60);
}
function closePanel(){
  $("#panel").classList.remove("on");
  $("#panel").setAttribute("aria-hidden", "true");
  $("#scrim").classList.remove("on");
  state.editing = null;
  state.draft = { img:null, iz:1, ix:0, iy:0 };
}
function syncStage(){
  const st = $("#stage"), d = state.draft, has = !!d.img;
  st.innerHTML = "";
  st.classList.toggle("empty", !has);

  const list = state.chars.map(c => c.height);
  const h = parseFloat($("#fHeight").value);
  if (list.length && Number.isFinite(h)){
    const all = list.concat([h]);
    const lo = Math.min(...all), hi = Math.max(...all);
    paint(st, hi > lo ? (h - lo) / (hi - lo) : 0.5);
  } else {
    st.style.setProperty("--ch", 210); st.style.setProperty("--cs", "12%"); st.style.setProperty("--cl", "62%");
  }

  if (has){
    const im = document.createElement("img");
    im.src = d.img; im.alt = ""; im.draggable = false;
    im.style.setProperty("--iz", d.iz);
    im.style.setProperty("--ix", d.ix);
    im.style.setProperty("--iy", d.iy);
    st.appendChild(im);
  } else {
    const sp = document.createElement("span");
    sp.className = "initial";
    sp.textContent = [...$("#fName").value.trim()][0] || "?";
    st.appendChild(sp);
  }
  const hint = document.createElement("span");
  hint.className = "hintline";
  hint.textContent = has ? "끌어서 위치 조절" : "클릭 · 드래그 · 붙여넣기";
  st.appendChild(hint);

  $("#izoom").disabled = !has;
  $("#izoom").value = Math.round(d.iz * 100);
  $("#izoomVal").textContent = Math.round(d.iz * 100) + "%";
  $("#fitImgBtn").disabled = !has;
  $("#containBtn").disabled = !has;
  $("#clearImgBtn").disabled = !has;
}

/* object-fit:contain fits the WHOLE picture inside the disc at iz 1, so
   scaling up is what crops — the opposite of cover, where the crop
   happened first and scaling could never give it back.
   fitScale/fillScale/panRange all work in ratios of the disc, so a
   stored framing stays correct at any avatar size. */
function fitScale(im){            /* iz that shows the whole picture */
  return 1;
}
function fillScale(im){           /* iz that fills the circle edge to edge */
  if (!im || !im.naturalWidth) return 1;
  return Math.max(im.naturalWidth, im.naturalHeight) / Math.min(im.naturalWidth, im.naturalHeight);
}
function drawnRatio(im, iz){      /* rendered size, in units of the disc */
  const c = Math.min(1 / im.naturalWidth, 1 / im.naturalHeight) * iz;
  return { w: im.naturalWidth * c, h: im.naturalHeight * c };
}
function panRange(im, iz){
  if (!im || !im.naturalWidth) return { x:0, y:0 };
  const d = drawnRatio(im, iz);
  return { x: Math.abs(d.w - 1) / 2 * 100, y: Math.abs(d.h - 1) / 2 * 100 };
}

/* downscale so localStorage stays small; keep aspect for reframing */
function hasAlpha(g, w, h){
  const d = g.getImageData(0, 0, w, h).data;
  /* sample every 4th pixel — enough to spot a transparent background */
  for (let i = 3; i < d.length; i += 16) if (d[i] < 250) return true;
  return false;
}
function ingest(file){
  if (!file || !file.type.startsWith("image/")){ toast("이미지 파일만 넣을 수 있습니다"); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX = 480;
      const s = Math.min(1, MAX / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.width * s));
      cv.height = Math.max(1, Math.round(img.height * s));
      const g = cv.getContext("2d");
      g.drawImage(img, 0, 0, cv.width, cv.height);
      /* keep a transparent background transparent; JPEG only when opaque */
      const alpha = hasAlpha(g, cv.width, cv.height);
      const data = alpha ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", 0.86);
      /* contain means iz 1 already shows all of it */
      state.draft = { img: data, iz:1, ix:0, iy:0 };
      syncStage();
    };
    img.onerror = () => toast("이미지를 읽지 못했습니다");
    img.src = fr.result;
  };
  fr.onerror = () => toast("파일을 읽지 못했습니다");
  fr.readAsDataURL(file);
}

function commit(){
  const name = $("#fName").value.trim();
  const h = parseFloat($("#fHeight").value);
  if (!name){ toast("이름을 입력해 주세요"); $("#fName").focus(); return; }
  if (!Number.isFinite(h) || h < 80 || h > 280){ toast("키는 80~280cm 사이로 입력해 주세요"); $("#fHeight").focus(); return; }
  const d = state.draft;
  const rec = normalize({ id: state.editing || uid(), name, series: $("#fSeries").value.trim(),
                          height: h, img: d.img, fv: 2, iz: d.iz, ix: d.ix, iy: d.iy });
  const i = state.chars.findIndex(x => x.id === rec.id);
  if (i >= 0) state.chars[i] = rec; else state.chars.push(rec);
  save(); render(); closePanel();
  toast(i >= 0 ? `${rec.name} 수정됨` : `${rec.name} 추가됨`);
}

let toastT;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ─── export: PNG ────────────────────────────────────────── */
function loadImage(src){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = src;
  });
}
function roundRect(g, x, y, w, h, r){
  if (g.roundRect){ g.beginPath(); g.roundRect(x, y, w, h, r); return; }
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
/* mirrors .disc img: object-fit contain, then scale(iz), then translate(ix%,iy%) */
function drawFramed(g, img, cx, cy, D, iz, ix, iy){
  g.save();
  g.beginPath(); g.arc(cx, cy, D / 2, 0, Math.PI * 2); g.clip();
  const contain = Math.min(D / img.width, D / img.height) * iz;
  const w = img.width * contain, h = img.height * contain;
  g.drawImage(img, cx - w / 2 + (ix / 100) * D, cy - h / 2 + (iy / 100) * D, w, h);
  g.restore();
}
function wrapText(g, text, maxW, maxLines){
  const words = text.split(/(\s+)/);
  const lines = [];
  let cur = "";
  const push = () => { if (cur) lines.push(cur.trim()); cur = ""; };
  for (const w of words){
    if (g.measureText(cur + w).width <= maxW || !cur){ cur += w; continue; }
    push();
    if (lines.length >= maxLines) break;
    cur = w.trim();
  }
  if (lines.length < maxLines) push();
  /* hard-break a single word that still overflows */
  for (let i = 0; i < lines.length; i++){
    while (g.measureText(lines[i]).width > maxW && lines[i].length > 1) lines[i] = lines[i].slice(0, -1);
  }
  return lines.slice(0, maxLines);
}

async function buildPNG(){
  const L = computeLayout();
  if (!L) throw new Error("empty");
  try { await document.fonts.ready; } catch(e){}

  const M = 26, HEAD = 58, DPR = 2;
  const W = L.W + M * 2, H = L.H + HEAD + M * 2;
  const cv = document.createElement("canvas");
  cv.width = W * DPR; cv.height = H * DPR;
  const g = cv.getContext("2d");
  g.scale(DPR, DPR);

  const col = {
    field: cssVar("--field"), paper: cssVar("--paper"), ink: cssVar("--ink"),
    ink2: cssVar("--ink-2"), ink3: cssVar("--ink-3"), rule: cssVar("--rule"), ruleSoft: cssVar("--rule-soft"),
  };
  const SANS = '"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif';
  const MONO = '"IBM Plex Mono",monospace';

  const paper2 = cssVar("--paper-2");
  if (paper2){
    const lg = g.createLinearGradient(0, 0, 0, H);
    lg.addColorStop(0, col.paper); lg.addColorStop(1, paper2);
    g.fillStyle = lg;
  } else g.fillStyle = col.paper;
  g.fillRect(0, 0, W, H);

  /* header */
  g.fillStyle = col.ink;
  g.font = `700 26px "Bricolage Grotesque",${SANS}`;
  g.textBaseline = "alphabetic";
  g.fillText("캐릭터 키 비교", M, M + 22);
  g.save();
  g.fillStyle = col.ink3; g.font = `500 12px ${MONO}`; g.textAlign = "right";
  g.fillText("@whitecotchi", W - M, M + 20);
  g.restore();
  const hs = L.list.map(c => c.height);
  const avg = (hs.reduce((a, b) => a + b, 0) / hs.length).toFixed(1);
  g.fillStyle = col.ink3;
  g.font = `500 12px ${MONO}`;
  g.fillText(`${hs.length}명 · ${fmt(hs[0])}–${fmt(hs[hs.length - 1])}cm · 평균 ${avg}cm`, M, M + 42);

  /* field */
  const OX = M, OY = M + HEAD;
  g.save();
  roundRect(g, OX, OY, L.W, L.H, 10);
  g.fillStyle = col.field; g.fill();
  g.strokeStyle = col.rule; g.lineWidth = 1; g.stroke();
  g.clip();
  g.translate(OX, OY);

  /* graph-paper ruling */
  const gs = state.mode === "prop" ? (state.ppc >= 24 ? state.ppc : state.ppc * 5) : 60;
  g.strokeStyle = col.ruleSoft; g.lineWidth = 1; g.globalAlpha = 0.7;
  g.beginPath();
  if (L.vert){
    for (let x = 0; x <= L.W; x += 60){ g.moveTo(x + .5, 0); g.lineTo(x + .5, L.H); }
    const off = state.mode === "prop" ? L.top0 % gs : 0;
    for (let y = off; y <= L.H; y += gs){ g.moveTo(0, y + .5); g.lineTo(L.W, y + .5); }
  } else {
    const off = state.mode === "prop" ? PAD : 0;
    for (let x = off; x <= L.W; x += gs){ g.moveTo(x + .5, 0); g.lineTo(x + .5, L.H); }
    for (let y = 0; y <= L.H; y += 60){ g.moveTo(0, y + .5); g.lineTo(L.W, y + .5); }
  }
  g.stroke();
  g.globalAlpha = 1;

  /* ruler baseline + ticks */
  g.fillStyle = col.ink; g.globalAlpha = .8;
  if (L.vert) g.fillRect(GUT - 1, 0, 1.5, L.H); else g.fillRect(0, L.baseline, L.W, 1.5);
  g.globalAlpha = 1;

  if (state.mode === "prop"){
    const { step, lab } = tickPlan();
    g.textBaseline = "middle";
    for (let h = L.lo; h <= L.hi; h += step){
      const major = h % lab === 0;
      g.fillStyle = major ? col.ink3 : col.rule;
      if (L.vert){
        const y = L.top0 + (L.hi - h) * state.ppc;
        const w = major ? 12 : 6;
        g.fillRect(GUT - 1 - w, y, w, 1);
        if (major){
          g.fillStyle = col.ink3; g.font = `500 11px ${MONO}`; g.textAlign = "left";
          g.fillText(String(h), 6, y);
        }
      } else {
        const x = PAD + (h - L.lo) * state.ppc;
        g.fillRect(x - .5, L.baseline, 1, major ? 12 : 6);
        if (major){
          g.fillStyle = col.ink3; g.font = `500 11px ${MONO}`; g.textAlign = "center";
          g.fillText(String(h), x, L.baseline + 22);
        }
      }
    }
  }
  g.fillStyle = col.ink3; g.font = `500 10px ${MONO}`; g.textAlign = "left"; g.textBaseline = "middle";
  if (L.vert) g.fillText("CM", 6, 10); else g.fillText("CM", 12, L.H - 12);

  /* leaders + emphasised ticks */
  for (const it of L.items){
    g.strokeStyle = rampCss(it.t, .5); g.lineWidth = 1; g.setLineDash([3, 3]);
    g.beginPath();
    if (L.vert){ g.moveTo(L.baseline, it.cy + .5); g.lineTo(it.cx - L.D / 2 - 4, it.cy + .5); }
    else { g.moveTo(it.cx + .5, L.blockBot(it.lane)); g.lineTo(it.cx + .5, L.baseline); }
    g.stroke(); g.setLineDash([]);
    g.fillStyle = rampCss(it.t);
    g.beginPath();
    if (L.vert) g.arc(L.baseline, it.cy, 3, 0, Math.PI * 2);
    else g.arc(it.cx, L.baseline, 3, 0, Math.PI * 2);
    g.fill();
    if (L.vert) g.fillRect(GUT - 17, it.tickAt - 1, 16, 2);
    else g.fillRect(it.tickAt - 1, L.baseline, 2, 16);
  }

  /* tokens */
  const imgs = new Map();
  await Promise.all(L.items.filter(it => it.c.img).map(async it => {
    try { imgs.set(it.c.id, await loadImage(it.c.img)); } catch(e){}
  }));

  for (const it of L.items){
    const c = it.c, D = L.D, cx = it.cx, cy = it.cy;
    g.save();
    g.shadowColor = "rgba(20,24,31,.20)"; g.shadowBlur = 14; g.shadowOffsetY = 5;
    g.fillStyle = rampCss(it.t);
    g.beginPath(); g.arc(cx, cy, D / 2, 0, Math.PI * 2); g.fill();
    g.restore();

    const im = imgs.get(c.id);
    if (im) drawFramed(g, im, cx, cy, D, c.iz, c.ix, c.iy);
    else {
      g.fillStyle = inkOn(it.t);
      g.font = `700 ${Math.round(D * .4)}px "Bricolage Grotesque",${SANS}`;
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText([...c.name][0] || "?", cx, cy + D * .02);
    }
    g.strokeStyle = rampCss(it.t, .55); g.lineWidth = 1.5;
    g.beginPath(); g.arc(cx, cy, D / 2 + 3.5, 0, Math.PI * 2); g.stroke();

    /* label block */
    const alignC = !L.vert;
    const tx = alignC ? cx : cx + D / 2 + 11;
    const maxW = alignC ? L.tokW : VTEXT;
    let ty = alignC ? cy + D / 2 + 18 : cy;
    g.textAlign = alignC ? "center" : "left";
    g.textBaseline = "middle";

    const lines = [];
    g.font = `600 12.5px ${SANS}`;
    for (const s of wrapText(g, c.name, maxW, 2)) lines.push({ s, f:`600 12.5px ${SANS}`, c:col.ink, lh:16 });
    if (c.series){
      g.font = `400 10.5px ${SANS}`;
      for (const s of wrapText(g, c.series, maxW, 2)) lines.push({ s, f:`400 10.5px ${SANS}`, c:col.ink3, lh:13 });
    }
    const chipH = 18, blockH = lines.reduce((a, l) => a + l.lh, 0) + chipH + 5;
    if (!alignC) ty = cy - blockH / 2 + 8;
    for (const l of lines){
      g.font = l.f; g.fillStyle = l.c;
      g.fillText(l.s, tx, ty);
      ty += l.lh;
    }
    /* cm chip */
    g.font = `600 11.5px ${MONO}`;
    const label = fmt(c.height) + "cm";
    const tw = g.measureText(label).width, cw = tw + 15;
    const cxx = alignC ? tx - cw / 2 : tx;
    roundRect(g, cxx, ty - 2, cw, chipH, 9);
    g.fillStyle = rampCss(it.t, .14); g.fill();
    g.strokeStyle = rampCss(it.t, .32); g.lineWidth = 1; g.stroke();
    const chipShift = parseFloat(cssVar("--chip")) || 0;
    const rc = ramp(it.t);
    g.fillStyle = `hsl(${rc.h} ${rc.s}% ${rc.l + toneNow() + chipShift}%)`;
    g.textAlign = alignC ? "center" : "left";
    g.fillText(label, alignC ? tx : cxx + 7.5, ty + chipH / 2 - 2);
  }

  g.restore();
  return new Promise((res, rej) => cv.toBlob(b => (b ? res(b) : rej(new Error("blob"))), "image/png"));
}

/* ─── export: standalone HTML ────────────────────────────── */
/* JSON that is safe to sit inside a script element */
function safeJSON(v){
  return JSON.stringify(v)
    .replace(/</g, "\u003c")
    .replace(/\u2028/g, "\u2028")
    .replace(/\u2029/g, "\u2029");
}
function buildHTML(){
  const doc = document.documentElement.cloneNode(true);
  /* Strip only the nodes render() regenerates, each scoped to the container
     that owns it. Bare class selectors are not safe here: the image stage
     carries .empty as a state flag and an unscoped ".empty" deleted it,
     which took #stage out of the saved file and broke its boot. */
  doc.querySelectorAll(
    "#plot .tok, #plot .leader, #plot .empty, " +
    "#ruler .tick, #ruler .rlab, #ruler .runit, #ruler .base, " +
    "#stats .stat, script[data-seed]"
  ).forEach(n => n.remove());
  const t = doc.querySelector("#toast"); if (t){ t.textContent = ""; t.className = "toast"; }
  const p = doc.querySelector("#panel"); if (p){ p.className = "panel"; p.setAttribute("aria-hidden", "true"); }
  const sc = doc.querySelector("#scrim"); if (sc) sc.className = "scrim";
  const st = doc.querySelector("#stage"); if (st){ st.innerHTML = '<span class="initial">?</span>'; st.className = "stage empty"; }
  ["#plot", "#grid", "#ruler", "#fieldwrap"].forEach(s => { const n = doc.querySelector(s); if (n) n.removeAttribute("style"); });
  const sa = doc.querySelector("#savedAt"); if (sa) sa.textContent = "";

  const data = Object.assign(snapshot(), { eid: uid() });
  const seed = doc.ownerDocument.createElement("script");
  seed.setAttribute("data-seed", "1");
  seed.textContent = "window.__HC_SEED__=" + safeJSON(data) + ";";
  const first = doc.querySelector("script");
  if (first && first.parentNode) first.parentNode.insertBefore(seed, first);
  else doc.querySelector("body").appendChild(seed);

  return "<!doctype html>\n" + doc.outerHTML;
}

/* ─── saving ─────────────────────────────────────────────── */
const dlCap = (() => {
  try {
    if (window.claude && typeof window.claude.use === "function")
      return window.claude.use("downloads").catch(() => null);
  } catch(e){}
  return Promise.resolve(null);
})();

async function saveFile(filename, data){
  const cap = await dlCap;
  if (cap && typeof cap.save === "function"){
    await cap.save({ filename, data });
    return "saved";
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type:"text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return "saved";
}
function saveError(e){
  const code = e && e.code;
  if (code === "declined") return;                        /* the viewer said no */
  if (code === "too_large") { toast("파일이 16MB를 넘습니다 — 이미지를 줄여 주세요"); return; }
  if (code === "rate_limited") { toast("잠시 후 다시 눌러 주세요"); return; }
  toast("저장하지 못했습니다");
}
function stamp(){
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

async function doPNG(){
  const b = $("#pngBtn");
  if (!state.chars.length){ toast("저장할 캐릭터가 없습니다"); return; }
  b.disabled = true; b.textContent = "그리는 중…";
  try {
    const blob = await buildPNG();
    await saveFile(`캐릭터키비교-${stamp()}.png`, blob);
    toast("PNG를 저장했습니다");
  } catch(e){ saveError(e); }
  finally { b.disabled = false; b.textContent = "🖼 PNG로 저장"; }
}
async function doHTML(){
  const b = $("#htmlBtn");
  b.disabled = true;
  try {
    await saveFile(`캐릭터키비교-${stamp()}.html`, buildHTML());
    toast("HTML을 저장했습니다 — 열면 지금 데이터 그대로 나옵니다");
  } catch(e){ saveError(e); }
  finally { b.disabled = false; }
}

/* ─── wiring ─────────────────────────────────────────────── */
$("#addBtn").addEventListener("click", () => openPanel(null));
$("#closeBtn").addEventListener("click", closePanel);
$("#cancelBtn").addEventListener("click", closePanel);
$("#scrim").addEventListener("click", closePanel);
$("#saveBtn").addEventListener("click", commit);
$("#delBtn").addEventListener("click", () => {
  const c = state.chars.find(x => x.id === state.editing);
  if (!c) return;
  state.chars = state.chars.filter(x => x.id !== state.editing);
  save(); render(); closePanel();
  toast(`${c.name} 삭제됨`);
});
$("#fName").addEventListener("input", syncStage);
$("#fHeight").addEventListener("input", syncStage);
$("#panel").addEventListener("keydown", e => {
  if (e.key === "Escape") closePanel();
  if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "range"){ e.preventDefault(); commit(); }
});

/* image: pick, drop, paste, pan, zoom */
const stage = $("#stage");
$("#pickBtn").addEventListener("click", () => $("#file").click());
stage.addEventListener("click", () => { if (!state.draft.img) $("#file").click(); });
stage.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); $("#file").click(); } });
$("#file").addEventListener("change", e => { ingest(e.target.files[0]); e.target.value = ""; });
["dragenter", "dragover"].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.add("dz"); }));
["dragleave", "drop"].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.remove("dz"); }));
stage.addEventListener("drop", e => { if (e.dataTransfer.files[0]) ingest(e.dataTransfer.files[0]); });
document.addEventListener("paste", e => {
  if (!$("#panel").classList.contains("on")) return;
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items) if (it.type.startsWith("image/")){ ingest(it.getAsFile()); return; }
});
$("#izoom").addEventListener("input", e => {
  state.draft.iz = clamp(Number(e.target.value) / 100, 0.25, 6);
  $("#izoomVal").textContent = Math.round(state.draft.iz * 100) + "%";
  const im = stage.querySelector("img");
  if (!im) return;
  const r = panRange(im, state.draft.iz);
  state.draft.ix = clamp(state.draft.ix, -r.x, r.x);
  state.draft.iy = clamp(state.draft.iy, -r.y, r.y);
  im.style.setProperty("--iz", state.draft.iz);
  im.style.setProperty("--ix", state.draft.ix);
  im.style.setProperty("--iy", state.draft.iy);
});
$("#fitImgBtn").addEventListener("click", () => {
  const im = stage.querySelector("img");
  state.draft.iz = clamp(fillScale(im), 0.25, 6);
  state.draft.ix = 0; state.draft.iy = 0;
  syncStage();
});
/* object-fit:cover already crops to the short side, so the scale that
   brings the whole picture back into view is exactly its aspect ratio */
$("#containBtn").addEventListener("click", () => {
  state.draft.iz = fitScale(stage.querySelector("img"));
  state.draft.ix = 0; state.draft.iy = 0;
  syncStage();
});
$("#clearImgBtn").addEventListener("click", () => { state.draft = { img:null, iz:1, ix:0, iy:0 }; syncStage(); });

let pan = null;
stage.addEventListener("pointerdown", e => {
  if (!state.draft.img) return;
  pan = { x:e.clientX, y:e.clientY, ix:state.draft.ix, iy:state.draft.iy,
          size:stage.clientWidth, r:panRange(stage.querySelector("img"), state.draft.iz) };
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("dragging");
});
stage.addEventListener("pointermove", e => {
  if (!pan) return;
  state.draft.ix = clamp(pan.ix + ((e.clientX - pan.x) / pan.size) * 100, -pan.r.x, pan.r.x);
  state.draft.iy = clamp(pan.iy + ((e.clientY - pan.y) / pan.size) * 100, -pan.r.y, pan.r.y);
  const im = stage.querySelector("img");
  if (im){ im.style.setProperty("--ix", state.draft.ix); im.style.setProperty("--iy", state.draft.iy); }
});
["pointerup", "pointercancel"].forEach(t => stage.addEventListener(t, () => { pan = null; stage.classList.remove("dragging"); }));

/* view controls */
function syncZoomUI(){
  $("#zoom").value = state.ppc;
  $("#zoomVal").textContent = state.ppc + " px/cm";
}
function setOrient(o){
  if (o !== state.orient){
    /* a vertical chart wants a much smaller cm-to-pixel scale than a
       horizontal one, so each orientation keeps its own */
    if (state.orient === "h") state.ppcH = state.ppc; else state.ppcV = state.ppc;
    state.ppc = o === "v" ? state.ppcV : state.ppcH;
    syncZoomUI();
  }
  state.orient = o;
  $("#oH").setAttribute("aria-pressed", String(o === "h"));
  $("#oV").setAttribute("aria-pressed", String(o === "v"));
  save(); render();
}
function setMode(m){
  state.mode = m;
  $("#mProp").setAttribute("aria-pressed", String(m === "prop"));
  $("#mRank").setAttribute("aria-pressed", String(m === "rank"));
  $("#zoomKnob").classList.toggle("off", m !== "prop");
  $("#zoom").disabled = m !== "prop";
  $("#fitBtn").disabled = m !== "prop";
  save(); render();
}
$("#oH").addEventListener("click", () => setOrient("h"));
$("#oV").addEventListener("click", () => setOrient("v"));
$("#mProp").addEventListener("click", () => setMode("prop"));
$("#mRank").addEventListener("click", () => setMode("rank"));

$("#zoom").addEventListener("input", e => {
  state.ppc = Number(e.target.value);
  $("#zoomVal").textContent = state.ppc + " px/cm";
  render();
});
$("#zoom").addEventListener("change", save);
$("#size").addEventListener("input", e => {
  state.size = Number(e.target.value);
  $("#sizeVal").textContent = state.size + " px";
  render();
});
$("#size").addEventListener("change", save);
$("#fitBtn").addEventListener("click", () => {
  if (!state.chars.length) return;
  const { lo, hi } = bounds(state.chars);
  const avail = state.orient === "v"
    ? Math.max(360, (window.innerHeight || 800) - 260) - (state.size + 40)
    : $("#fieldwrap").clientWidth - PAD * 2;
  state.ppc = clamp(Math.floor(avail / (hi - lo)), 18, 130);
  syncZoomUI();
  save(); render();
});

$("#pngBtn").addEventListener("click", doPNG);
$("#htmlBtn").addEventListener("click", doHTML);
$("#resetBtn").addEventListener("click", () => {
  state.chars = SEED.map(normalize);
  save(); render();
  toast("예시 데이터로 되돌렸습니다");
});
function setTheme(t){
  state.theme = t;
  document.documentElement.setAttribute("data-theme", t);
  for (const b of $("#themeSeg").children) b.setAttribute("aria-pressed", String(b.dataset.set === t));
  save(); render();
}
$("#themeSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-set]");
  if (b) setTheme(b.dataset.set);
});

let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 140); });

/* ─── boot ───────────────────────────────────────────────── */
load();
$("#zoom").value = state.ppc;
$("#zoomVal").textContent = state.ppc + " px/cm";
$("#size").value = state.size;
$("#sizeVal").textContent = state.size + " px";
$("#oH").setAttribute("aria-pressed", String(state.orient === "h"));
$("#oV").setAttribute("aria-pressed", String(state.orient === "v"));
setTheme(state.theme);
setMode(state.mode);
})();
</script>
